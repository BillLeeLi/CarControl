# 方向 PD 与前进速度 PI 的离线起始参数；尚未经过实车标定。
/**:
  ros__parameters:
    sensorTopic: /sync_store_node/allsensor
    group_label: midterm-pd-pi-v1
    show_visualization: true
    control_mode: closed_loop  # closed_loop: PD/PI；baseline: 旧比例转向和固定动力
    reference_mode: perception  # perception: 跟踪感知方向；straight: 仅接受合格的 0° 候选
    target_speed_mps: 0.2  # 物理目标速度，0 直接停车；不是底层 speed 控制量
    # 默认要求独立反馈有效且与激光时间接近；false 仅用于离线查看感知。
    require_motion_feedback: true
    odom_topic: /encoder_imu_node/odom
    odom_frame_id: odom
    odom_child_frame_id: base_link
    odom_min_dt_s: 0.01
    odom_max_dt_s: 0.5
    odom_filter_tau_s: 0.15
    odom_max_speed_mps: 3.0
    odom_max_yaw_rate_rps: 6.0
    odom_timeout_s: 0.5
    odom_scan_tolerance_s: 0.15
    odom_history_s: 2.0
    sensor_yaw_offset_deg: 0.0
    vehicle_width_m: 0.35
    front_overhang_m: 0.30
    rear_overhang_m: 0.15
    safety_margin_m: 0.10
    lookahead_m: 1.50
    max_distance_m: 5.0
    front_half_angle_deg: 75.0
    bin_angle_deg: 1.0
    min_bin_valid_ratio: 0.5
    min_window_valid_ratio: 0.6
    max_interpolate_gap_deg: 2.0
    interpolate_range_jump_m: 0.5
    max_inferred_ratio: 0.2
    forward_weight: 0.25
    continuity_weight: 0.10
    steer_center: 0
    steer_limit: 600
    # 以下两项仅在 control_mode=baseline 时使用。
    steer_gain_per_rad: -300.0
    cruise_speed: -100
    stop_speed: 0
    # 方向误差以 rad 计，控制符号与增益分开配置。
    steer_sign: -1
    steer_kp: 300.0
    steer_kd: 30.0
    steer_derivative_tau_s: 0.15
    steer_jump_reset_deg: 20.0
    steer_rate_limit: 300.0
    # speed = stop_speed + speed_sign * 前进动力幅度；本版不自动倒车制动。
    speed_sign: -1
    speed_kp: 100.0
    speed_ki: 30.0
    speed_feedforward_gain: 200.0
    speed_feedforward_offset: 0.0
    speed_effort_limit: 120.0
    speed_integral_limit: 30.0
    speed_rate_limit: 80.0
    target_accel_mps2: 0.2
    target_decel_mps2: 0.4
    max_target_speed_mps: 0.5
    control_min_dt_s: 0.01
    control_max_dt_s: 0.5
    sensor_timeout_s: 1.0
    log_period_s: 1.0
