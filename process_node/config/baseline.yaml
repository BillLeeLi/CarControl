# 方向 PD 与前进速度 PI 的离线起始参数；尚未经过实车标定。
/**:
  ros__parameters:
    sensorTopic: /sync_store_node/allsensor
    group_label: midterm-recovery-v6
    show_visualization: true
    input_odom_queue_size: 200  # 独立接收线程的有界缓存；主线程先批量更新里程计
    visualization_period_s: 0.1  # 最多 10 Hz 刷新图像，窗口/按键事件仍持续处理
    control_mode: closed_loop  # closed_loop: PD/PI；baseline: 旧比例转向和固定动力
    reference_mode: corridor  # corridor: 走廊回正/回中；perception: 旧评分；straight: 中位/PI 测试
    target_speed_mps: 0.2  # 物理目标速度，0 直接停车；不是底层 speed 控制量
    # 默认要求独立反馈有效且与激光时间接近；false 仅用于离线查看感知。
    require_motion_feedback: true
    odom_topic: /encoder_imu_node/odom
    odom_frame_id: odom
    odom_child_frame_id: base_link
    odom_min_dt_s: 0.01
    odom_max_dt_s: 0.5
    odom_filter_tau_s: 0.15
    odom_max_speed_mps: 3.0
    odom_max_yaw_rate_rps: 6.0
    odom_timeout_s: 0.5
    odom_scan_tolerance_s: 0.15
    odom_history_s: 2.0
    sensor_yaw_offset_deg: 0.0
    # 2026-10-23 实测，前后距离取上限：车体约 0.22 m 宽、0.42 m 长。
    # 雷达在宽度中线；这两个前后距离都相对雷达，不是相对 base_link。
    vehicle_width_m: 0.22
    front_overhang_m: 0.16
    rear_overhang_m: 0.26
    safety_margin_m: 0.10  # 额外裕量独立于车体实测尺寸
    lookahead_m: 1.50
    max_distance_m: 5.0
    # +inf 按“此有限规划范围内未命中”参与候选；原始 ranges 仍保留 inf。
    # 实际上限还受 LaserScan.range_max 限制，0 可禁用；不是实测自由距离。
    no_return_distance_m: 5.0
    min_scan_finite_ratio: 0.05  # 整帧至少 5% 为真实有限回波；全 inf 仍停止
    front_half_angle_deg: 75.0
    bin_angle_deg: 1.0
    min_bin_valid_ratio: 0.5  # 有限回波 + 受限无回波的可用比例
    min_window_valid_ratio: 0.6  # 不再要求窗口内必须有有限回波
    max_interpolate_gap_deg: 2.0
    interpolate_range_jump_m: 0.5
    max_inferred_ratio: 0.2
    forward_weight: 0.25
    continuity_weight: 0.10
    # 墙面拟合只使用真实有限点；这些安装平移相对 odom_child_frame_id 原点。
    corridor_sensor_x_m: 0.0
    corridor_sensor_y_m: 0.0
    corridor_fit_range_m: 4.5
    corridor_fit_front_m: 4.0
    corridor_fit_rear_m: 0.3
    corridor_voxel_m: 0.05
    corridor_ransac_trials: 80
    corridor_max_lines: 6
    corridor_line_tolerance_m: 0.06
    corridor_min_inliers: 12
    corridor_min_span_m: 1.2
    corridor_max_rmse_m: 0.04
    corridor_min_wall_distance_m: 0.25
    corridor_max_heading_deg: 45.0
    corridor_parallel_tolerance_deg: 8.0
    corridor_min_width_m: 0.9
    corridor_max_width_m: 3.5
    # 相邻墙面观测先补偿车体运动，再检查跳变和做低通。
    corridor_max_heading_change_deg: 12.0
    corridor_max_center_change_m: 0.20
    corridor_max_width_change_m: 0.25
    corridor_confirm_frames: 3
    corridor_filter_tau_s: 0.25
    corridor_max_update_gap_s: 0.5
    corridor_single_wall_timeout_s: 0.6
    corridor_hold_timeout_s: 0.3
    corridor_max_unobserved_travel_m: 0.2
    # 局部中线目标；偏差较大、单墙或历史保持时，请求速度乘 slow_speed_scale。
    corridor_goal_distance_m: 1.5
    corridor_lateral_gain: 1.0
    corridor_max_lateral_correction_deg: 20.0
    corridor_max_target_deg: 45.0
    corridor_candidate_tolerance_deg: 5.0
    corridor_recovery_heading_deg: 15.0
    corridor_recovery_offset_m: 0.25
    corridor_slow_speed_scale: 0.5
    # 道路出口提供几何证据；右转行为另行门控，不能只靠 preferred_id 下发转向。
    exit_enabled: true
    exit_search_front_m: 4.0
    exit_search_rear_m: 0.3
    exit_sample_step_m: 0.10
    exit_min_width_m: 1.0
    exit_max_width_m: 3.5
    exit_probe_depth_m: 1.0
    exit_min_depth_visible_ratio: 0.15
    exit_forward_gate_m: 1.3
    exit_clearance_m: 0.08
    exit_direction_offset_deg: 20.0
    exit_wall_band_m: 0.25
    exit_min_wall_points: 5
    exit_min_wall_span_m: 0.45
    exit_confirm_frames: 3
    exit_confirm_time_s: 0.15
    exit_match_distance_m: 0.8
    exit_match_angle_deg: 30.0
    exit_hold_time_s: 0.5
    exit_hold_travel_m: 0.5
    exit_context_timeout_s: 3.0
    exit_context_travel_m: 2.0
    exit_max_update_gap_s: 0.5
    exit_prefer_right: true
    # 墙端旁斜前方开口只标为 SUSPECTED，可低速接近，不能直接触发大转向。
    exit_corner_enabled: true
    exit_corner_min_angle_deg: 20.0
    exit_corner_max_angle_deg: 85.0
    exit_corner_depth_m: 0.6
    exit_corner_jump_m: 0.7
    exit_corner_wall_radius_m: 0.6
    exit_corner_wall_span_m: 0.35
    exit_corner_match_distance_m: 1.2
    exit_corner_match_angle_deg: 60.0
    # 单个右转：CRUISE -> APPROACH -> TURN -> EXIT_ALIGN -> CRUISE。
    # 以下为离线初值；min_radius、PD 响应与停车减速度必须实车核验。
    turn_enabled: true  # false 恢复仅巡航；perception/straight 模式自动不接管
    turn_approach_speed_mps: 0.10
    turn_speed_mps: 0.10
    turn_activate_distance_m: 3.5
    turn_min_radius_m: 0.70
    turn_max_radius_m: 1.20
    turn_radius_samples: 4
    turn_lookahead_m: 0.65
    turn_check_distance_m: 0.80
    turn_sample_step_m: 0.04
    turn_reaction_time_s: 0.30
    turn_braking_decel_mps2: 0.30
    turn_exit_extension_m: 1.50
    turn_max_tracking_error_m: 0.55
    turn_min_angle_deg: 55.0
    turn_max_angle_deg: 125.0
    turn_hint_timeout_s: 0.50
    turn_hint_context_s: 1.0
    turn_max_update_gap_s: 0.50
    turn_max_duration_s: 60.0  # 含最远 3.5 m 接近及低速出口对齐，不是固定转弯时长
    turn_max_travel_m: 7.0
    turn_exit_heading_tolerance_deg: 15.0
    turn_exit_center_tolerance_m: 0.30
    turn_exit_confirm_frames: 3
    turn_passed_exit_distance_m: 1.0
    # 独立局部恢复：只在 corridor + closed_loop 的正常参考失效后接管。
    # 先停车确认，再搜索朝可信道路/已确认出口前进的安全短弧；不向未知侧路盲转。
    recovery_enabled: true
    recovery_speed_mps: 0.06
    recovery_stop_speed_mps: 0.05
    recovery_confirm_frames: 3
    recovery_confirm_time_s: 0.20
    recovery_check_distance_m: 0.60
    recovery_curvature_samples: 13
    recovery_max_heading_deviation_deg: 65.0
    recovery_guide_timeout_s: 1.0
    recovery_guide_travel_m: 0.35
    recovery_max_input_gap_s: 1.0
    recovery_max_duration_s: 20.0
    recovery_max_travel_m: 0.80
    recovery_max_attempts: 3
    recovery_normal_reset_time_s: 1.0
    recovery_progress_timeout_s: 4.0
    recovery_min_progress_m: 0.03
    steer_center: 0
    steer_limit: 600
    # 以下两项仅在 control_mode=baseline 时使用。
    steer_gain_per_rad: -300.0
    cruise_speed: -100
    stop_speed: 0
    # 方向误差以 rad 计，控制符号与增益分开配置。
    steer_sign: -1
    steer_kp: 3000.0
    steer_kd: 30.0
    steer_derivative_tau_s: 0.15
    steer_jump_reset_deg: 20.0
    steer_rate_limit: 300.0
    # speed = stop_speed + speed_sign * 前进动力幅度；本版不自动倒车制动。
    speed_sign: -1
    speed_kp: 100.0
    speed_ki: 30.0
    speed_feedforward_gain: 200.0
    speed_feedforward_offset: 0.0
    speed_effort_limit: 120.0
    speed_integral_limit: 30.0
    speed_rate_limit: 80.0
    target_accel_mps2: 0.2
    target_decel_mps2: 0.4
    max_target_speed_mps: 0.5
    control_min_dt_s: 0.01
    control_max_dt_s: 0.5
    sensor_timeout_s: 1.0
    log_period_s: 1.0
